@if (user(); as user) {
  <button
    type="button"
    class="avatar"
    [matMenuTriggerFor]="menu"
    [attr.aria-label]="'userMenu.label' | transloco: { initials: initials(), name: fullName() }"
  >
    <span aria-hidden="true">{{ initials() }}</span>
  </button>

  <mat-menu #menu="matMenu" xPosition="before" class="account-menu">
    <div class="user" role="presentation">
      <span class="user-name">{{ fullName() }}</span>
      <span class="user-email">{{ user.email }}</span>
    </div>
    <mat-divider />

    <button mat-menu-item type="button" [matMenuTriggerFor]="themeMenu">
      <mat-icon>{{ themeIcon() }}</mat-icon>
      <span>{{ 'userMenu.theme' | transloco }}</span>
      <span class="item-value">{{ themeLabel() | transloco }}</span>
    </button>
    <button mat-menu-item type="button" [matMenuTriggerFor]="languageMenu">
      <mat-icon>language</mat-icon>
      <span>{{ 'userMenu.language' | transloco }}</span>
      <span class="item-value">{{ activeLanguage().label }}</span>
    </button>
    <a mat-menu-item routerLink="/profile">
      <mat-icon>account_circle</mat-icon>
      <span>{{ 'profile.title' | transloco }}</span>
    </a>

    <mat-divider />
    <button mat-menu-item type="button" (click)="signOut()">
      <mat-icon>logout</mat-icon>
      <span>{{ 'userMenu.signOut' | transloco }}</span>
    </button>
  </mat-menu>

  <!-- Radio items: the menu stays the single place to change the theme -->
  <mat-menu #themeMenu="matMenu" class="account-menu">
    @for (option of themeOptions; track option.value) {
      <button
        mat-menu-item
        type="button"
        role="menuitemradio"
        [attr.aria-checked]="theme.preference() === option.value"
        (click)="theme.setPreference(option.value)"
      >
        <mat-icon>{{ option.icon }}</mat-icon>
        <span>{{ option.label | transloco }}</span>
        @if (theme.preference() === option.value) {
          <!-- Wrapped: a direct mat-icon child would be placed in the leading icon slot -->
          <span class="check" aria-hidden="true"><mat-icon>check</mat-icon></span>
        }
      </button>
    }
  </mat-menu>

  <mat-menu #languageMenu="matMenu" class="account-menu">
    @for (language of languages; track language.code) {
      <button
        mat-menu-item
        type="button"
        role="menuitemradio"
        [attr.aria-checked]="language.code === activeLang()"
        [disabled]="!language.available"
        (click)="setLanguage(language.code)"
      >
        <span>{{ language.label }}</span>
        @if (language.code === activeLang()) {
          <!-- Wrapped: a direct mat-icon child would be placed in the leading icon slot -->
          <span class="check" aria-hidden="true"><mat-icon>check</mat-icon></span>
        } @else if (!language.available) {
          <span class="item-value">{{ 'userMenu.comingSoon' | transloco }}</span>
        }
      </button>
    }
  </mat-menu>
}
