<a class="skip-link" href="#main-content" (click)="skipToMain($event)">{{
  'app.skipToMain' | transloco
}}</a>

<mat-toolbar class="top-bar" role="banner">
  @if (!isExpanded()) {
    <button
      matIconButton
      type="button"
      [attr.aria-label]="'app.openNavigation' | transloco"
      aria-controls="app-nav"
      [attr.aria-expanded]="navOpened()"
      (click)="toggleDrawer()"
    >
      <mat-icon>menu</mat-icon>
    </button>
  }

  <a class="brand" routerLink="/products" [attr.aria-label]="'app.goToProducts' | transloco">
    <span class="brand-logo" aria-hidden="true"><mat-icon>inventory_2</mat-icon></span>
    <span class="brand-name">{{ 'app.name' | transloco }}</span>
  </a>

  <span class="spacer"></span>

  <app-account-menu />
</mat-toolbar>

<mat-sidenav-container class="body">
  <mat-sidenav
    id="app-nav"
    class="nav"
    [mode]="isExpanded() ? 'side' : 'over'"
    [opened]="navOpened()"
    [disableClose]="isExpanded()"
    (closedStart)="onDrawerClosed()"
  >
    <div class="nav-content">
      <nav [attr.aria-label]="'app.mainNavigation' | transloco">
        <mat-nav-list>
          @for (item of navItems; track item.path) {
            <a
              mat-list-item
              [routerLink]="item.path"
              routerLinkActive
              #link="routerLinkActive"
              [activated]="link.isActive"
              ariaCurrentWhenActive="page"
              (click)="onNavigate()"
            >
              <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
              <span matListItemTitle>{{ item.label | transloco }}</span>
              @if (item.count?.(); as count) {
                <span matListItemMeta class="nav-meta">
                  <span class="nav-count"
                    >{{ count
                    }}<span class="visually-hidden"> {{ item.countLabel! | transloco }}</span></span
                  >
                </span>
              }
            </a>
          }
        </mat-nav-list>
      </nav>
    </div>
  </mat-sidenav>

  <mat-sidenav-content>
    <main id="main-content" #main class="main" tabindex="-1">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
