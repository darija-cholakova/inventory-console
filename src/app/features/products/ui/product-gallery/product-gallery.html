<div class="main">
  <app-product-image
    [src]="current()"
    fill
    priority
    showText
    [alt]="
      'products.gallery.imageAlt'
        | transloco: { title: title(), index: selected() + 1, total: images().length }
    "
  />
</div>

@if (images().length > 1) {
  <div class="thumbs" role="toolbar" [attr.aria-label]="'products.gallery.images' | transloco">
    @for (image of images(); track image; let i = $index) {
      <button
        #thumb
        type="button"
        class="thumb"
        [class.active]="i === selected()"
        [attr.aria-pressed]="i === selected()"
        [attr.aria-label]="
          'products.gallery.showImage' | transloco: { index: i + 1, total: images().length }
        "
        [tabindex]="i === selected() ? 0 : -1"
        (click)="select(i)"
        (keydown)="onKeydown($event, i)"
      >
        <app-product-image [src]="image" [size]="64" />
      </button>
    }
  </div>
}
