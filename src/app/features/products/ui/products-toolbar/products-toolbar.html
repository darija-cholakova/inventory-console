<div class="toolbar" role="search">
  <mat-form-field appearance="outline" class="search" subscriptSizing="dynamic">
    <mat-label>Search</mat-label>
    <mat-icon matPrefix aria-hidden="true">search</mat-icon>
    <input matInput type="search" [formControl]="search" placeholder="Search by name, brand…" />
    @if (search.value) {
      <button
        matIconButton
        matSuffix
        type="button"
        aria-label="Clear search"
        (click)="clearSearch()"
      >
        <mat-icon>close</mat-icon>
      </button>
    }
  </mat-form-field>

  <mat-form-field appearance="outline" class="category" subscriptSizing="dynamic">
    <mat-label>Category</mat-label>
    <!-- '' stands for "all", so the select shows the label instead of an empty field -->
    <mat-select
      [value]="query().category ?? ''"
      (selectionChange)="categoryChange.emit($event.value || null)"
    >
      <mat-option value="">All categories</mat-option>
      @for (category of categories(); track category.slug) {
        <mat-option [value]="category.slug">{{ category.name }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  @if (showSort()) {
    <mat-form-field appearance="outline" class="sort" subscriptSizing="dynamic">
      <mat-label>Sort by</mat-label>
      <mat-select [value]="sortValue()" (selectionChange)="onSortSelected($event.value)">
        @for (option of sortOptions; track option.value) {
          <mat-option [value]="option.value">{{ option.label }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  }
</div>
