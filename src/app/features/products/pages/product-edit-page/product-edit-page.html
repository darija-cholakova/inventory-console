<app-back-link [link]="['/products', id()]" label="Product" />

@if (product.isLoading()) {
  <div role="status">
    <span class="visually-hidden">Loading product…</span>
    <mat-progress-bar mode="indeterminate" aria-hidden="true" />
  </div>
} @else if (notFound()) {
  <app-state-message
    icon="search_off"
    title="Product not found"
    message="This product may have been deleted, or the link is wrong."
  >
    <a matButton="filled" routerLink="/products">Back to products</a>
  </app-state-message>
} @else if (product.error()) {
  <app-state-message
    icon="error"
    title="Couldn't load the product"
    message="The server didn't respond."
  >
    <button matButton="tonal" type="button" (click)="product.reload()">Try again</button>
  </app-state-message>
} @else if (view(); as p) {
  <section class="card" aria-labelledby="edit-title">
    <h1 id="edit-title" class="page-title">Edit product</h1>
    <app-product-form
      [product]="p"
      [categories]="categories.value() ?? []"
      (saved)="onSaved()"
      (cancelled)="onCancelled()"
    />
  </section>
}
