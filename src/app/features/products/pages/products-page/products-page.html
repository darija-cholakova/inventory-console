<header class="header">
  <h1 #heading class="page-title" tabindex="-1">{{ 'products.title' | transloco }}</h1>
  @if (store.status() === 'success' || store.isRefreshing()) {
    <p class="summary">{{ summary() }}</p>
  }
</header>

<app-products-toolbar
  [query]="store.query()"
  [categories]="store.categories()"
  [showSort]="!showTable()"
  (searchChange)="onSearch($event)"
  (categoryChange)="onCategory($event)"
  (sortChange)="onSort($event)"
/>

<section class="results" [attr.aria-label]="'products.list.results' | transloco">
  @if (store.isRefreshing()) {
    <mat-progress-bar
      class="refresh-bar"
      mode="indeterminate"
      [attr.aria-label]="'products.list.updating' | transloco"
    />
  }

  @if (store.isInitialLoading()) {
    <app-products-skeleton />
  } @else if (store.status() === 'error') {
    <app-state-message
      icon="error"
      [title]="'products.list.loadError' | transloco"
      [message]="'products.list.loadErrorMessage' | transloco"
    >
      <button matButton="tonal" type="button" (click)="retry()">
        {{ 'buttons.tryAgain' | transloco }}
      </button>
    </app-state-message>
  } @else if (store.isEmpty()) {
    <app-state-message
      icon="search_off"
      [title]="emptyTitle()"
      [message]="'products.list.emptyMessage' | transloco"
    >
      <button matButton="tonal" type="button" (click)="clearFilters()">
        {{ 'buttons.clearFilters' | transloco }}
      </button>
    </app-state-message>
  } @else {
    @if (showTable()) {
      <app-products-table
        [items]="store.items()"
        [query]="store.query()"
        (sortChange)="onSort($event)"
        (edit)="onEdit($event)"
        (delete)="onDelete($event)"
      />
    } @else {
      <app-product-cards
        [items]="store.items()"
        (edit)="onEdit($event)"
        (delete)="onDelete($event)"
      />
    }

    <mat-paginator
      [length]="store.total()"
      [pageIndex]="store.query().page - 1"
      [pageSize]="store.query().pageSize"
      [pageSizeOptions]="pageSizeOptions"
      (page)="onPage($event)"
      [attr.aria-label]="'products.list.pagination' | transloco"
    />
  }
</section>
