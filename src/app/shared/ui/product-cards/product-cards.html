<ul class="cards" aria-label="Products">
  @for (product of items(); track product.id) {
    <li class="card">
      <app-product-image class="thumb" [src]="product.thumbnail" [size]="64" />
      <div class="info">
        <a class="title" [routerLink]="['/products', product.id]">{{ product.title }}</a>
        <span class="meta">
          {{ product.category }}
          <span aria-hidden="true">· ★ {{ product.rating | number: '1.1-1' }}</span>
          <span class="visually-hidden"
            >, rating {{ product.rating | number: '1.1-1' }} out of 5</span
          >
        </span>
        <span class="row">
          <span class="price">{{ product.price | currency: 'USD' }}</span>
          <app-stock-chip [stock]="product.stock" />
        </span>
      </div>
      <app-bookmark-button class="bookmark" [product]="product" />
      <button
        matIconButton
        type="button"
        class="actions"
        [matMenuTriggerFor]="cardMenu"
        [attr.aria-label]="'Actions for ' + product.title"
      >
        <mat-icon>more_vert</mat-icon>
      </button>
      <mat-menu #cardMenu="matMenu" xPosition="before">
        <a mat-menu-item [routerLink]="['/products', product.id]">
          <mat-icon>visibility</mat-icon>
          <span>View details</span>
        </a>
        <button mat-menu-item type="button" (click)="edit.emit(product)">
          <mat-icon>edit</mat-icon>
          <span>Edit</span>
        </button>
        <button mat-menu-item type="button" class="destructive" (click)="delete.emit(product)">
          <mat-icon>delete</mat-icon>
          <span>Delete</span>
        </button>
      </mat-menu>
    </li>
  }
</ul>
